services:
  postgres:
    image: postgres:16-alpine
    container_name: fcs-postgres
    environment:
      POSTGRES_USER: quarkus_test
      POSTGRES_PASSWORD: quarkus_test
      POSTGRES_DB: quarkus_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus_test"]
      interval: 2s
      timeout: 3s
      retries: 15
